'use strict';
(function () {
  const W = 720, H = 1570;
  const Q = new URLSearchParams(location.search);
  const AUTO = Q.has('auto'), SPEED = +(Q.get('speed') || 1);
  const BASE = window.TQ_BASE || 'assets/';
  const D = DATA;
  const cv = document.getElementById('game'), ctx = cv.getContext('2d');
  let SC = 1, OX = 0, OY = 0, DPR = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    const w = innerWidth, h = innerHeight;
    SC = Math.min(w / W, h / H);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
    OX = (w - W * SC) / 2; OY = (h - H * SC) / 2;
  }
  addEventListener('resize', resize); resize();

  // ---------------- 工具 ----------------
  const rnd = Math.random, clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;

    const add = (x, y) => P.push([x, y]);
    const stag = (y0, y1, dx, dy, mask) => {
      for (let y = y0, r = 0; y <= y1; y += dy, r++) for (let x = (r % 2 ? 40 + dx / 2 : 40) + 20; x <= 680; x += dx) if (!mask || mask(x, y)) add(x, y);
    };
    const cx = 360, cy = 960;
    switch (tpl) {
      case 0: stag(650, 1290, 80, 80); break; // 方格
      case 1: stag(640, 1300, 68, 64, (x, y) => { const d = Math.abs(x - cx) / 340 + Math.abs(y - cy) / 360; return d < 0.55 || d > 0.7; }); break; // 菱格
      case 2: add(cx, cy); for (const r of [72, 142, 212, 282, 352]) { const n = Math.round(2 * Math.PI * r / 62); for (let i = 0; i < n; i++) add(cx + r * Math.cos(i / n * 6.283 + r), cy + r * Math.sin(i / n * 6.283 + r)); } break; // 同心圆
      case 3: { // 八卦
        for (let i = 0; i < 8; i++) add(cx + 80 * Math.cos(i * 0.785), cy + 80 * Math.sin(i * 0.785));
        for (let i = 0; i < 8; i++) { const a = i * 0.785 + 0.39, ux = Math.cos(a), uy = Math.sin(a); for (const d of [160, 220, 280, 340]) for (const s of [-56, 0, 56]) add(cx + ux * d - uy * s, cy + uy * d + ux * s); }
        break;
      }
      case 4: stag(640, 1300, 72, 68, (x, y) => Math.hypot(x - cx, y - 790) < 170 || Math.hypot(x - cx, (y - 1110) * 1.1) < 240 || x < 110 || x > 610); break; // 葫芦形
      case 5: for (let k = 0; k < 10; k++) { const dir = k % 2 ? 1 : -1; for (let i = 0; i < 11; i++) add(62 + i * 60 + (k % 2) * 30, 660 + k * 66 + dir * (i - 5) * 10); } break; // 斜坡
      case 6: // 漏斗
        for (let i = 0; i < 7; i++) { add(70 + i * 38, 650 + i * 52); add(650 - i * 38, 650 + i * 52); }
        stag(690, 960, 70, 64, (x, y) => Math.abs(x - cx) < (y - 600) * 0.5); stag(1010, 1300, 68, 62); break;
      case 7: stag(640, 1300, 70, 64, (x, y) => Math.abs(x - 190) < 120 || Math.abs(x - 530) < 120 || y > 1060 || (y > 760 && y < 860)); break; // 双塔
      case 8: for (let r = 0; r < 9; r++) for (let x = 60 + (r % 2) * 36; x <= 670; x += 72) add(x, 650 + r * 78 + 26 * Math.sin(x / 90 + r)); break; // 波浪
      case 9: { // 星形
        const pts = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, R = i % 2 ? 140 : 330; pts.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]); }
        for (let i = 0; i < 10; i++) { const [x0, y0] = pts[i], [x1, y1] = pts[(i + 1) % 10], n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / 62)); for (let k = 0; k < n; k++) add(lerp(x0, x1, k / n), lerp(y0, y1, k / n)); }
        const inStar = (x, y) => { let c = false; for (let i = 0, j = 9; i < 10; j = i++) { const [xi, yi] = pts[i], [xj, yj] = pts[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };
        stag(650, 1300, 70, 66, (x, y) => inStar(x, y) || Math.hypot(x - cx, y - cy) > 300); break;
      }
    }
    const out = [];
    for (const [x, y] of P) {
      if (x < 42 || x > 678 || y < 625 || y > 1310) continue;
      if (out.some(p => Math.hypot(p[0] - x, p[1] - y) < 48)) continue;
      out.push([x, y]);
    }
    return out;
  }

  let B = null;

  function calcLinks() {
    B.links = [];

    for (let i = 0; i < ps.length; i++) for (let j = i + 1; j < ps.length; j++) {

    }

  function refillQueue() { while (B.queue.length < 4) B.queue.push(...shuffle(S.bag.slice())); }
  function restoreBoard(reason) {

  function gourdW() { return 120 * (1 + fuVal('jubao') / 100 + (B.wu.kuanhuai ? 0.5 : 0)); }
  function gourdSpeed() { return 220 * (B.wu.zhishui ? 0.6 : 1) * (1 - fuVal('dingxin') / 100); }
  function gourdMul() { return B.wu.hukou ? 2 : 1.5; }
  const gourdHidden = () => B.intent && B.intent.t === 'yequ';

  function floatText(x, y, s, color, size = 34, f = 'N', life = 0.9) { B.floats.push({ x, y, s, color, size, f, t: 0, life }); }

  function spawnCoin(id, x, y, ang, mul) {

    B.coins.push({ id, def, fx, x, y, vx: Math.sin(ang) * v, vy: Math.cos(ang) * v, r: 16 * (B.wu.zhongqian ? 1.3 : 1),

  function coinVals(c) {
    const kg = D.KAIGUANG[(S.coins[c.id] ? S.coins[c.id].lv : 1) - 1];

  // 本发伤害（final=true 时计葫芦）
  function shotDamage(final) {
    const sh = B.cur; if (!sh) return 0;
    let sum = 0, anyG = false;
    for (const c of B.coins) {
      const v = coinVals(c), g = final && c.caught ? gourdMul() : 1;
      if (c.caught) anyG = true;
      sum += (c.units * (sh.crit ? v.c : v.n) + c.flat) * g;
    }
    const flat = sh.flat + (B.wu.wanli ? 8 : 0);
    sum += flat * (final && anyG ? gourdMul() : 1);
    let m = 1;
    if (B.wu.yishang) m *= 1.4;
    if (B.shots === 1 && fuVal('kaimen')) m *= fuVal('kaimen');
    if (B.wu.jishao) m *= 1 + 0.15 * Math.floor(sh.hits / 10);
    if (S.role === 'shusheng') m *= 1 + 0.1 * Math.floor(sh.hits / 10);
    if (fuVal('lianhuan') && sh.hits >= 15) m *= 1 + fuVal('lianhuan') / 100;
    m *= Math.pow(0.8, sh.seal);

  }
  function countHit(c, p) {
    const sh = B.cur;

    if (!sh.first) { sh.first = true; if (S.role === 'daoshi') sh.flat += 3; }
    if (c.fx.late && sh.hits >= 10) c.flat += c.fx.late * c.mul;
    if (p) {
      if (p.type === 'zhu') {
        if (!sh.crit) { B.shake = 12; floatText(p.x, p.y - 40, '暴击', '#ff5a3a', 44, 'T'); snd(196, 0.25, 'sawtooth', 0.08); if (!B.critEver) { B.critEver = true; } }
        sh.crit = true;
        if (c.fx.cinnabar && !sh.cinn) { sh.cinn = true; shuffle(B.pins.filter(q => !q.broken && q.type === 'qing')).slice(0, c.fx.cinnabar).forEach(q => { q.type = 'zhu'; q.flash = 0.5; }); }
      }
      if (p.type === 'jin') { sh.xiang += 2; sh.gold++; if (c.fx.goldBonus) c.flat += c.fx.goldBonus * c.mul; floatText(p.x, p.y - 30, '香火+2', '#ffd85e', 26, 'B'); }
      if (p.ink) { p.ink = false; c.flat += 3 * c.mul; }
    }
    const hv = fuVal('huichun'); if (hv && sh.hits % hv === 0) healMe(1);

  function healMe(v) { B.me.hp = Math.min(B.me.max, B.me.hp + v); floatText(110, 250, '+' + v, '#7dff9a', 30); }
  function breakPin(p) { p.broken = true; p.flash = 0.3; }
  function hitPin(c, p) {
    if (p.cool > 0) return;
    p.cool = 0.12; p.flash = 0.25; burst(p.x, p.y, 70);
    if (p.type === 'bamboo') { snd(392, 0.05, 'square', 0.04); return; }
    if (p.type === 'feng') {
      if (c.fx.paper) { p.type = 'qing'; floatText(p.x, p.y - 30, '化解', '#bff', 28, 'B'); countHit(c, p); breakPin(p); return; }
      B.cur.seal++; breakPin(p); floatText(p.x, p.y - 30, '封 -20%', '#c8a0ff', 30, 'B'); snd(150, 0.2, 'sawtooth', 0.08); return;
    }
    if (p.type === 'lei' && !p.lit) { p.lit = true; p.cool = 0.25; countHit(c, p); floatText(p.x, p.y - 30, '雷', '#c9a0ff', 30, 'T'); return; }
    if (p.type === 'lei' && p.lit) {
      breakPin(p); countHit(c, p); burst(p.x, p.y, 220); B.shake = 10; snd(110, 0.35, 'sawtooth', 0.1);
      for (const q of B.pins) if (!q.broken && q !== p && BREAKABLE[q.type] && Math.hypot(q.x - p.x, q.y - p.y) < 90) { breakPin(q); countHit(c, q); }
      return;
    }
    countHit(c, p);
    if (c.fx.ink && !p.ink) { p.ink = true; p.cool = 0.25; return; }
    if (c.fx.keep && rnd() < c.fx.keep) { p.cool = 0.25; return; }
    breakPin(p);
  }
  function stepCoin(c, dt) {
    c.life += dt; c.rot += dt * 6;
    c.vy += GRAV * dt; c.x += c.vx * dt; c.y += c.vy * dt;
    const sp = Math.hypot(c.vx, c.vy); if (sp > 1700) { c.vx *= 1700 / sp; c.vy *= 1700 / sp; }
    if (c.x < c.r) { c.x = c.r; c.vx = Math.abs(c.vx) * 0.85; wallHit(c); }
    if (c.x > W - c.r) { c.x = W - c.r; c.vx = -Math.abs(c.vx) * 0.85; wallHit(c); }
    if (c.y < TOP - 40 && c.vy < 0) { c.vy = Math.abs(c.vy) * 0.6; }
    for (const p of B.pins) {
      if (p.broken) continue;
      const dx = c.x - p.x, dy = c.y - p.y, rr = c.r + PIN_R, d2 = dx * dx + dy * dy;
      if (d2 >= rr * rr) continue;
      const d = Math.sqrt(d2) || 0.01, nx = dx / d, ny = dy / d;
      c.x = p.x + nx * rr; c.y = p.y + ny * rr;
      const vn = c.vx * nx + c.vy * ny;
      if (vn < 0) {
        c.vx -= (1 + c.e) * vn * nx; c.vy -= (1 + c.e) * vn * ny;
        c.vx += (rnd() - 0.5) * 40;
        if (Math.hypot(c.vx, c.vy) < 160) { c.vx += nx * 120 + (rnd() - 0.5) * 80; c.vy += ny * 120; }
      }
      hitPin(c, p);
      if (c.fx.split && !c.split) {
        c.split = true;
        for (let k = 1; k < c.fx.split; k++) {
          const a = (k % 2 ? 1 : -1) * (0.5 + 0.3 * Math.floor((k - 1) / 2));
          const n = Object.assign({}, c, { vx: c.vx * Math.cos(a) - c.vy * Math.sin(a), vy: c.vx * Math.sin(a) + c.vy * Math.cos(a), units: 0, flat: 0, life: 0 });
          B.coins.push(n);
        }
      }
    }
    // 卡住保护
    if (Math.hypot(c.vx, c.vy) < 40) { c.still += dt; if (c.still > 0.6) { c.vx += (rnd() - 0.5) * 300; c.vy -= 120; c.still = 0; } } else c.still = 0;
    // 葫芦口
    const prevY = c.y - c.vy * dt;
    if (!c.caught && c.vy > 0 && prevY < GY && c.y >= GY && Math.abs(c.x - B.gx) < gourdW() / 2) {
      c.caught = true; c.done = true;

    } else if (c.y > H - 60 || c.life > 14) {
      if (B.wu.yuyun && !c.yuyun && rnd() < 0.3) { c.yuyun = true; c.x = LX; c.y = LY + 20; c.vx = (rnd() - 0.5) * 400; c.vy = 200; floatText(LX, LY + 60, '余韵', '#bff', 30, 'T'); return; }
      c.done = true; endCoin(c);
    }
  }

  function yaoX() { return 360; }
  function applyDamage(d) {

  function enemyAct() {

        case 'summon': if (y.minions.length < 2) { const id = B.L.def.minion, mh = Math.round(y.max * D.MINION.hp); y.minions.push({ id, hp: mh, max: mh, x: y.minions.length ? 590 : 130 }); floatText(360, 200, '招小妖', '#ffb070', 36, 'T'); } break;
        case 'heal': { const v = Math.round(y.max * it.v); y.hp = Math.min(y.max, y.hp + v); floatText(360, 280, '+' + v, '#7dff9a', 44); break; }

    }

  // ======================================================================
  const RARITY_FR = ['fr_1', 'fr_2', 'fr_0', 'fr_3'];
  const RARITY_COLOR = ['#7fe07f', '#c890ff', '#ff7a5a', '#ffd85e'];
  function header(title) {
    ctx.fillStyle = '#1c0e2e'; ctx.fillRect(0, 0, W, H);
    img('bg_dg', 360, 785, 720, 1570, 0.25);
    backBtn(() => go(Home));
    text(title, 360, 62, 52, '#ffd85e', 'T', 'center', { stroke: '#5a1206', sw: 7 });
    currencyBar(24, 150);
  }
  const Bag = {
    sel: null,
    enter() { this.sel = this.sel || 'tongqian'; },
    draw() {
      header('钱袋');
      const n = bagSlots();
      text(`携带 ${S.bag.length}/${n}   点袋中铜钱可取出`, 40, 230, 26, '#e8dcff', 'B', 'left');
      for (let i = 0; i < n; i++) {
        const x = 70 + i * 82, y = 300;
        ctx.beginPath(); ctx.arc(x, y, 36, 0, 7); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill(); ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 2; ctx.stroke();
        if (S.bag[i]) { spr('c_' + S.bag[i], x, y, 66, 66); hit(x - 38, y - 38, 76, 76, () => { if (S.bag.length > 1) { S.bag.splice(i, 1); save(); } else toast('钱袋里至少留一枚'); }); }
      }
      const owned = Object.keys(D.COINS).filter(k => S.coins[k]);
      text(`已得铜钱 ${owned.length}/${Object.keys(D.COINS).length}`, 40, 380, 26, '#e8dcff', 'B', 'left');
      owned.forEach((k, i) => {
        const x = 100 + (i % 4) * 173, y = 480 + Math.floor(i / 4) * 170, d = D.COINS[k];
        spr(RARITY_FR[d.r], x, y, 140, 132);
        spr('c_' + k, x, y - 6, 92, 92);
        text(`Lv${S.coins[k].lv}`, x + 44, y + 44, 22, '#fff', 'N', 'center', { stroke: '#200818', sw: 4 });
        text(d.name, x, y + 80, 24, this.sel === k ? '#ffd85e' : '#fff', 'T');
        if (this.sel === k) { ctx.strokeStyle = '#ffd85e'; ctx.lineWidth = 4; rrect(x - 74, y - 72, 148, 172, 14); ctx.stroke(); }
        hit(x - 74, y - 72, 148, 172, () => { this.sel = k; });
      });
      // 详情
      const k = this.sel, d = D.COINS[k], o = S.coins[k];
      if (!d || !o) return;
      panel(30, 1150, 660, 390);
      spr('c_' + k, 110, 1240, 110, 110);
      text(d.name, 190, 1210, 40, '#ffd85e', 'T', 'left');
      text(`${D.RARITY[d.r]}品  开光 Lv${o.lv}`, 190, 1260, 26, RARITY_COLOR[d.r], 'B', 'left');
      const kg = D.KAIGUANG[o.lv - 1];
      text(`普伤 ${+(d.n * kg).toFixed(1)}   暴伤 ${+(d.c * kg).toFixed(1)}`, 450, 1210, 26, '#fff', 'B', 'left');
      wrap(d.desc, 60, 1320, 600, 26, 36, '#e8dcff', 'B');
      const full = S.bag.length >= bagSlots();
      chip(60, 1440, 250, 72, full ? '钱袋已满' : '放入钱袋', () => { S.bag.push(k); save(); }, { disabled: full });
      if (o.lv < 5) {
        const [cx, cd] = D.KG_COST[o.lv], mul = D.RARITY_MUL[d.r], cost = cx * mul, can = S.xiang >= cost && S.dan >= cd;
        chip(340, 1440, 320, 72, `开光 香火${cost}${cd ? ' 妖丹' + cd : ''}`, () => { S.xiang -= cost; S.dan -= cd; o.lv++; save(); snd(1047, 0.3, 'sine', 0.12); toast(`${d.name} 开光至 Lv${o.lv}`); }, { disabled: !can, gold: can, size: 24 });
      } else chip(340, 1440, 320, 72, '已满级', null, { disabled: true });
    },
  };

  // ======================================================================
  // 符箓
  // ======================================================================
  const Fu = {
    sel: null,
    draw() {
      header('符箓');
      const n = fuSlots(), next = D.FU_SLOTS.find(([s]) => s > totalStars());
      text(`装备 ${S.equip.length}/${n}` + (next ? `   道行 ${next[0]} 星开第 ${next[1]} 槽` : ''), 40, 230, 26, '#e8dcff', 'B', 'left');
      for (let i = 0; i < 6; i++) {
        const x = 95 + i * 106, y = 330, open = i < n;
        rrect(x - 44, y - 70, 88, 140, 10); ctx.fillStyle = open ? 'rgba(0,0,0,0.45)' : 'rgba(0,0,0,0.2)'; ctx.fill(); ctx.strokeStyle = open ? '#8a6a3a' : '#3a2a3a'; ctx.lineWidth = 2; ctx.stroke();
        if (!open) text('锁', x, y, 30, '#5a4a5a', 'T');
        const id = S.equip[i];
        if (id) { spr('f_' + id, x, y, 62, 130); hit(x - 44, y - 70, 88, 140, () => { S.equip.splice(i, 1); save(); }); }
      }
      const owned = Object.keys(D.FU).filter(k => S.fus[k]);
      text(`已得符箓 ${owned.length}/${Object.keys(D.FU).length}`, 40, 440, 26, '#e8dcff', 'B', 'left');
      if (!owned.length) wrap('还没有符箓。香火铺和章节宝箱里能得到。', 60, 520, 600, 28, 40, '#bfb0d8', 'B');
      owned.forEach((k, i) => {
        const x = 90 + (i % 5) * 136, y = 600 + Math.floor(i / 5) * 270;
        spr('f_' + k, x, y, 100, 210, S.equip.includes(k) ? 0.5 : 1);
        if (S.fus[k].up) text('升', x + 40, y - 90, 26, '#ff7a5a', 'T', 'center', { stroke: '#200818', sw: 4 });
        if (S.equip.includes(k)) text('已装备', x, y, 24, '#fff', 'B', 'center', { stroke: '#200818', sw: 5 });
        text(D.FU[k].name, x, y + 122, 24, this.sel === k ? '#ffd85e' : '#fff', 'T');
        hit(x - 60, y - 110, 120, 250, () => { this.sel = k; });
      });
      const k = this.sel; if (!k || !S.fus[k]) return;
      const d = D.FU[k], o = S.fus[k], eq = S.equip.includes(k);
      panel(30, 1180, 660, 360);
      text(d.name, 60, 1230, 40, '#ffd85e', 'T', 'left');
      text(`${D.RARITY[d.r]}品${o.up ? '  已升阶' : ''}`, 300, 1232, 26, RARITY_COLOR[d.r], 'B', 'left');
      wrap(d.desc(o.up ? d.u : d.v), 60, 1300, 600, 28, 38, '#e8dcff', 'B');
      if (!o.up) text(`升阶后：${d.desc(d.u)}`, 60, 1360, 22, '#bfb0d8', 'B', 'left');
      chip(60, 1440, 260, 72, eq ? '卸下' : (S.equip.length >= fuSlots() ? '槽位已满' : '装备'), () => { if (eq) S.equip.splice(S.equip.indexOf(k), 1); else S.equip.push(k); save(); }, { disabled: !eq && S.equip.length >= fuSlots() });
      if (!o.up) chip(350, 1440, 300, 72, '升阶 妖丹3', () => { S.dan -= 3; o.up = 1; save(); toast(`${d.name} 已升阶`); }, { disabled: S.dan < 3, gold: S.dan >= 3 });
    },
  };

  // ======================================================================
  // 香火铺
  // ======================================================================
  const Shop = {
    draw() {
      header('香火铺');
      text('每打完一关刷新一次', 360, 230, 26, '#e8dcff', 'B');
      const items = S.shop.items;
      if (!items.length) text('法器都已收齐，只剩妖丹可买', 360, 400, 28, '#bfb0d8', 'B');
      items.forEach((it, i) => {
        const x = 40 + (i % 2) * 330, y = 290 + Math.floor(i / 2) * 420, d = it.kind === 'coin' ? D.COINS[it.id] : D.FU[it.id];
        panel(x, y, 310, 400, 'rgba(40,16,30,0.85)');
        if (it.kind === 'coin') { spr(RARITY_FR[d.r], x + 155, y + 100, 150, 140); spr('c_' + it.id, x + 155, y + 96, 100, 100); }
        else spr('f_' + it.id, x + 155, y + 100, 80, 168);
        text(d.name, x + 155, y + 210, 34, '#ffd85e', 'T');
        text(`${D.RARITY[d.r]}品${it.kind === 'coin' ? '铜钱' : '符箓'}`, x + 155, y + 250, 22, RARITY_COLOR[d.r], 'B');
        wrap(it.kind === 'coin' ? `普${d.n} 暴${d.c} ${d.desc}` : d.desc(d.v), x + 20, y + 285, 270, 22, 30, '#e8dcff', 'B');
        if (it.sold) text('已售', x + 155, y + 360, 30, '#8a7a9a', 'T');
        else chip(x + 55, y + 330, 200, 56, `香火 ${it.price}`, () => {
          S.xiang -= it.price; it.sold = true;
          if (it.kind === 'coin') S.coins[it.id] = { lv: 1 }; else S.fus[it.id] = { up: 0 };
          save(); snd(988, 0.25, 'sine', 0.12); toast(`得到「${d.name}」`);
        }, { disabled: S.xiang < it.price, gold: S.xiang >= it.price });
      });
      const dn = S.shop.dan, y = 1150;
      panel(40, y, 640, 160, 'rgba(40,16,30,0.85)');
      spr('dan', 120, y + 80, 100, 100);
      text('妖丹 ×1', 200, y + 55, 34, '#ffb3a0', 'T', 'left');
      text('开光 Lv4 以上、符箓升阶要用', 200, y + 105, 22, '#e8dcff', 'B', 'left');
      if (dn.sold) text('已售', 590, y + 80, 30, '#8a7a9a', 'T');
      else chip(500, y + 50, 160, 60, `香火 ${dn.price}`, () => { S.xiang -= dn.price; S.dan++; dn.sold = true; save(); toast('得到妖丹 1'); }, { disabled: S.xiang < dn.price, gold: S.xiang >= dn.price, size: 24 });
    },
  };

  // ======================================================================
  // 镇妖簿
  // ======================================================================
  const Book = {
    tab: 0, page: 0,
    draw() {
      header('镇妖簿');
      ['妖怪', '法器', '关卡'].forEach((s, i) => chip(60 + i * 210, 210, 180, 64, s, () => { this.tab = i; this.page = 0; }, { gold: this.tab === i }));
      if (this.tab === 0) {
        const all = D.YAO_ALL, seen = all.filter(k => S.seen[k]).length;
        text(`已镇 ${seen}/${all.length}`, 360, 310, 26, '#e8dcff', 'B');
        this.grid(all, k => {
          const ok = D.YAO[k] && S.seen[k];
          return { name: ok ? D.YAO[k].name : '？？？', draw: (x, y) => ok ? img('yao_' + k, x, y, 130, 130) : text('？', x, y, 70, '#4a3a5a', 'T'), on: ok ? () => this.yaoDetail(k) : null };
        });
      } else if (this.tab === 1) {
        const all = D.COINS_ALL.map(k => ['coin', k]).concat(D.FU_ALL.map(k => ['fu', k]));
        const got = all.filter(([t, k]) => t === 'coin' ? S.coins[k] : S.fus[k]).length;
        text(`法器 ${got}/${all.length}（铜钱 36 符箓 40）`, 360, 310, 26, '#e8dcff', 'B');
        this.grid(all, ([t, k]) => {
          const ok = t === 'coin' ? S.coins[k] : S.fus[k], d = t === 'coin' ? D.COINS[k] : D.FU[k];
          return {
            name: ok ? d.name : '？？？',
            draw: (x, y) => ok ? (t === 'coin' ? spr('c_' + k, x, y, 100, 100) : spr('f_' + k, x, y, 56, 118)) : text('？', x, y, 70, '#4a3a5a', 'T'),
            on: ok ? () => msgBox(d.name, t === 'coin' ? `${D.RARITY[d.r]}品铜钱\n普伤 ${d.n} 暴伤 ${d.c}\n${d.desc}` : `${D.RARITY[d.r]}品符箓\n${d.desc(d.v)}`) : null,
          };
        });
      } else {
        text(`道行 ${totalStars()} 星`, 360, 310, 26, '#e8dcff', 'B');
        for (let c = 1; c <= 20; c++) {
          const x = 70 + ((c - 1) % 2) * 320, y = 360 + Math.floor((c - 1) / 2) * 112, ch = D.CHAPTERS[c - 1];
          panel(x, y, 300, 96, ch ? 'rgba(40,16,30,0.85)' : 'rgba(20,10,20,0.5)', ch ? '#d9a84a' : '#4a3a4a');
          text(`第${CN[c]}章`, x + 20, y + 32, 26, ch ? '#ffd85e' : '#6a5a6a', 'T', 'left');
          text(ch ? ch.name : '未开放', x + 20, y + 68, 24, ch ? '#fff' : '#6a5a6a', 'B', 'left');
          if (ch) { const st = [1, 2, 3, 4, 5, 6].reduce((a, l) => a + (S.stars[c + '-' + l] || 0), 0); spr('star', x + 210, y + 48, 36, 36); text(`${st}/18`, x + 232, y + 50, 26, '#fff', 'N', 'left'); }
        }
      }
    },
    grid(all, fn) {
      const per = 16, pages = Math.ceil(all.length / per); this.page = clamp(this.page, 0, pages - 1);
      all.slice(this.page * per, this.page * per + per).forEach((it, i) => {
        const x = 105 + (i % 4) * 170, y = 430 + Math.floor(i / 4) * 230, v = fn(it);
        panel(x - 78, y - 85, 156, 210, 'rgba(40,16,30,0.75)', v.on ? '#d9a84a' : '#4a3a4a');
        v.draw(x, y);
        text(v.name, x, y + 95, 24, v.on ? '#ffe7a8' : '#6a5a6a', 'T');
        if (v.on) hit(x - 78, y - 85, 156, 210, v.on);
      });
      text(`${this.page + 1}/${pages}`, 360, 1380, 30, '#fff', 'N');
      if (this.page > 0) chip(60, 1350, 180, 64, '上一页', () => { this.page--; });
      if (this.page < pages - 1) chip(480, 1350, 180, 64, '下一页', () => { this.page++; });
    },
    yaoDetail(k) {
      const d = D.YAO[k];
      modal = {
        draw() {
          ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
          spr('scroll', 360, 800, 600, 880);
          img('yao_' + k, 360, 640, 340, 340);
          text(d.name, 360, 850, 50, '#7a1d08', 'T');
          text({ n: '普通', e: '精英', b: '大妖' }[d.type], 360, 905, 26, '#6a4a28', 'B');
          wrap(d.note, 180, 970, 360, 30, 44, '#4a2a10', 'B');
          bigBtn(360, 1110, 260, 90, '合上', () => { modal = null; }, { size: 34 });
        },
      };
    },
  };

  // ======================================================================
  // 角色
  // ======================================================================
  const Role = {
    draw() {
      header('角色');
      D.ROLES.forEach((r, i) => {
        const y = 220 + i * 260, own = S.roles[r.id], use = S.role === r.id;
        panel(30, y, 660, 240, use ? 'rgba(80,24,20,0.9)' : 'rgba(40,16,30,0.85)', use ? '#ffd85e' : '#d9a84a');
        if (IMG['role_' + r.id]) { ctx.save(); rrect(40, y + 10, 200, 220, 14); ctx.clip(); img('role_' + r.id, 140, y + 140, 240, 240, own ? 1 : 0.35); ctx.restore(); }
        else text('？', 140, y + 120, 100, '#4a3a5a', 'T');
        text(r.name, 270, y + 50, 40, '#ffd85e', 'T', 'left');
        text(`血量 ${r.hp}`, 520, y + 52, 26, '#fff', 'B', 'left');
        wrap(r.desc, 270, y + 105, 400, 24, 34, '#e8dcff', 'B');
        if (r.start) text('起手：' + r.start.map(k => D.COINS[k].name).join(' '), 270, y + 160, 22, '#bfb0d8', 'B', 'left');
        if (r.lock) text(r.lock, 270, y + 205, 24, '#8a7a9a', 'B', 'left');
        else if (use) text('使用中', 600, y + 200, 28, '#ffd85e', 'T');
        else if (own) chip(510, y + 172, 160, 56, '选用', () => { S.role = r.id; save(); });
        else {
          const can = S.xiang >= r.unlock.xiang;
          text(`通关第${CN[r.unlock.ch]}章解锁`, 270, y + 205, 22, '#bfb0d8', 'B', 'left');
          chip(480, y + 172, 190, 56, `香火 ${r.unlock.xiang}`, () => { S.xiang -= r.unlock.xiang; grantRole(r.id); save(); toast(`${r.name} 加入`); }, { disabled: !can, gold: can, size: 24 });
        }
      });
    },
  };

  // ======================================================================
  // 主循环
  // ======================================================================
  let last = performance.now(), loaded = false;
  function frame(now) {
    let dt = Math.min(0.05, (now - last) / 1000); last = now;
    dt *= SPEED; T += dt;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#0e0820'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(DPR * SC, 0, 0, DPR * SC, DPR * OX, DPR * OY);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    HITS = [];
    if (!loaded) { text('铜钱镇妖', 360, 700, 80, '#ffd85e', 'T'); text('载入中', 360, 800, 30, '#cdbfe8', 'B'); }
    else {
      if (AUTO && scene === Result && Result.t > 0.5) window.TQ.onResult && window.TQ.onResult();
      if (AUTO && modal) modal = null;
      scene.draw(dt);
      if (modal) { HITS = []; modal.draw(dt); }
      drawToast(dt);
    }
    ctx.restore();
    requestAnimationFrame(frame);
  }
  window.TQ = { results: [], shotLog: [], get S() { return S; }, get B() { return B; }, startBattle, go: n => go({ Home, MapS, Bag, Fu, Shop, Book, Role }[n]), save, reset() { S = defSave(); save(); }, scene: () => scene, modal: () => !!modal };
  loadAll().then(() => { loaded = true; go(Home); });
  requestAnimationFrame(frame);
})();

</script></body></html>
